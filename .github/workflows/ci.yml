# Continuous integration of conductor-files: the quality gates, then both packages
# (amd64 and arm64, cross-compiled with CGO off) checked by Debian 13's
# lintian. Actions are pinned by commit SHA. Release builds: release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-files
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-files/go.mod
          cache-dependency-path: conductor-files/go.sum
      - name: Pinned gate tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: gofmt, vet, staticcheck, govulncheck, go test -race
        working-directory: conductor-files
        run: make check

  package:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: conductor-files
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conductor-files/go.mod
          cache-dependency-path: conductor-files/go.sum
      - name: Packages (amd64, arm64) and SBOMs
        working-directory: conductor-files
        run: make package
      - name: lintian (Debian 13)
        working-directory: conductor-files
        run: make lintian
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conductor-files-packages
          path: conductor-files/dist/
          retention-days: 7
