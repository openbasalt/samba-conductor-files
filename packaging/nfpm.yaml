# nfpm configuration of the "conductor-files" package. Built by
# packaging/build.sh, which sets ARCH, DEB_VERSION, DEB_REVISION, BUILD
# (staging directory) and SOURCE_DATE_EPOCH (every timestamp). Paths are
# relative to the repository root.
name: conductor-files
arch: ${ARCH}
platform: linux
version: ${DEB_VERSION}
version_schema: none
release: ${DEB_REVISION}
section: admin
priority: optional
maintainer: Samba Conductor maintainers <samba-conductor@openbasalt.org>
vendor: OpenBasalt
homepage: https://github.com/openbasalt/samba-conductor-files
license: Apache-2.0
description: |-
  Samba Conductor agent for domain-member file servers
  conductor-files runs on a Samba domain-member file server (never on a
  domain controller) and lets Samba Conductor's web interface manage its
  shares: shares in Samba's registry configuration, access by AD group
  applied as NT ACLs, live sessions. conductor connects over TLS 1.3 with
  both keys pinned after a one-time enrollment code made on the file server;
  every change is previewed, confirmed and audited on both sides.
  .
  Nothing is started at installation (see
  /usr/share/doc/conductor-files/README.Debian).

recommends:
  - samba (>= 2:4.19)
  - winbind
  - samba-common-bin
  - python3-samba
  - samba-ad-provision
  - acl
  - attr

contents:
  - expand: true
    src: ${BUILD}/bin/conductor-files
    dst: /usr/bin/conductor-files
    file_info: {mode: 0755}
  - expand: true
    src: ${BUILD}/systemd/conductor-files.service
    dst: /usr/lib/systemd/system/conductor-files.service
    file_info: {mode: 0644}
  - src: agent.toml.example
    dst: /etc/conductor-files/agent.toml
    type: config|noreplace
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/man/conductor-files.8.gz
    dst: /usr/share/man/man8/conductor-files.8.gz
    file_info: {mode: 0644}
  - src: packaging/copyright
    dst: /usr/share/doc/conductor-files/copyright
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/doc/conductor-files/NOTICE
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-files/THIRD-PARTY-LICENSES.gz
    dst: /usr/share/doc/conductor-files/THIRD-PARTY-LICENSES.gz
    file_info: {mode: 0644}
  - expand: true
    src: ${BUILD}/doc/conductor-files/changelog.Debian.gz
    dst: /usr/share/doc/conductor-files/changelog.Debian.gz
    file_info: {mode: 0644}
  - src: packaging/README.Debian
    dst: /usr/share/doc/conductor-files/README.Debian
    file_info: {mode: 0644}
  - src: packaging/lintian-overrides
    dst: /usr/share/lintian/overrides/conductor-files
    file_info: {mode: 0644}

scripts:
  postinstall: packaging/scripts/postinst
  preremove: packaging/scripts/prerm
  postremove: packaging/scripts/postrm
