# nfpm configuration of the "conductor-files-selinux" package (RPM only, noarch):
# the SELinux policy modules of conductor-files for the
# targeted policy (Fedora, Basalt OS). Built by packaging/build.sh after
# packaging/selinux/build.sh; it sets PKG_VERSION, PKG_REVISION,
# SELINUX_POLICY_VERSION (the policy the module was compiled against) and
# SELINUX_BUILD (build/selinux). Paths are relative to the repository root.
name: conductor-files-selinux
arch: all
platform: linux
version: ${PKG_VERSION}
version_schema: none
release: ${PKG_REVISION}
maintainer: Samba Conductor maintainers <samba-conductor@openbasalt.org>
vendor: OpenBasalt
homepage: https://github.com/openbasalt/samba-conductor-files
# The sources are Apache-2.0; the compiled module contains expansions of the
# reference policy's macros (selinux-policy, GPL-2.0-or-later).
license: Apache-2.0 AND GPL-2.0-or-later
description: |-
  SELinux policy module for the Samba Conductor file server agent
  The targeted-policy modules of conductor-files: the agent runs in
  conductor_files_t, limited to its configuration and state, Samba's
  registry configuration and databases, the share roots (samba_share_t)
  and its TLS port (conductor_files_port_t, TCP 7443). Installed with
  conductor-files wherever the targeted policy is.

rpm:
  summary: SELinux policy module for the Samba Conductor file server agent
  group: System Environment/Base
  buildhost: build.samba-conductor.openbasalt.org
  compression: zstd
  requires:
    post:
      - selinux-policy-targeted >= ${SELINUX_POLICY_VERSION}
      - policycoreutils
      - libselinux-utils
  scripts:
    posttrans: build/selinux/scripts/posttrans

depends:
  - selinux-policy-targeted >= ${SELINUX_POLICY_VERSION}

scripts:
  preinstall: build/selinux/scripts/pre
  postinstall: build/selinux/scripts/post
  postremove: build/selinux/scripts/postun

contents:
  - expand: true
    src: ${SELINUX_BUILD}/conductor_files.pp.bz2
    dst: /usr/share/selinux/packages/targeted/conductor_files.pp.bz2
    file_info: {mode: 0644}
  - expand: true
    src: ${SELINUX_BUILD}/conductor_files.if
    dst: /usr/share/selinux/devel/include/distributed/conductor_files.if
    file_info: {mode: 0644}
  - expand: true
    src: ${SELINUX_BUILD}/conductor_files_port.cil
    dst: /usr/share/selinux/packages/targeted/conductor_files_port.cil
    file_info: {mode: 0644}

  - dst: /usr/share/doc/conductor-files-selinux
    type: dir
    file_info: {mode: 0755}
  - src: packaging/selinux/README
    dst: /usr/share/doc/conductor-files-selinux/README
    type: doc
    file_info: {mode: 0644}

  - dst: /usr/share/licenses/conductor-files-selinux
    type: dir
    file_info: {mode: 0755}
  - src: LICENSE
    dst: /usr/share/licenses/conductor-files-selinux/LICENSE
    type: license
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/licenses/conductor-files-selinux/NOTICE
    type: license
    file_info: {mode: 0644}
  - expand: true
    src: ${SELINUX_BUILD}/doc/conductor-files-selinux/THIRD-PARTY-LICENSES
    dst: /usr/share/licenses/conductor-files-selinux/THIRD-PARTY-LICENSES
    type: license
    file_info: {mode: 0644}
